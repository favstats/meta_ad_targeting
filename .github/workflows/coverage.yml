name: "Coverage Dashboard"

on:
  schedule:
    - cron: "37 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: coverage-dashboard
  cancel-in-progress: true

jobs:
  build-coverage-dashboard:
    name: Build coverage dashboard
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
    steps:
      - name: Setup - Checkout repo
        uses: actions/checkout@v4

      - name: Build coverage manifest and dashboard
        run: python scripts/build_coverage_dashboard.py --output coverage

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-scraper-coverage
          path: coverage/

      - name: Publish dashboard release assets
        run: |
          if ! gh release view coverage-dashboard >/dev/null 2>&1; then
            gh release create coverage-dashboard \
              --title "Coverage Dashboard" \
              --notes "GitHub-only scraper coverage artifacts. Generated from release assets and workflow metadata; no Meta endpoints are called."
          fi
          gh release upload coverage-dashboard \
            coverage/coverage.json \
            coverage/coverage.csv \
            coverage/index.html \
            --clobber

      - name: Publish GitHub Pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pages_dir="$RUNNER_TEMP/gh-pages"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$pages_dir"
          else
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$pages_dir"
            cd "$pages_dir"
            git switch --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi

          find "$pages_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp coverage/coverage.json coverage/coverage.csv coverage/index.html "$pages_dir"/
          touch "$pages_dir/.nojekyll"

          cd "$pages_dir"
          git add -A
          if git diff --cached --quiet; then
            echo "No Pages changes to publish."
            exit 0
          fi
          git commit -m "Publish coverage dashboard"
          git push origin gh-pages
