name: Keepalive Workflow
on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sundays
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    name: Keep Repositories Active
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep workflows alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in targeting30.yml targeting7.yml targeting90.yml info.yml; do
            gh workflow enable "$workflow" || true
          done
