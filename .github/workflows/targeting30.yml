name: "Meta Targeting 30"
on:
  schedule:
    - cron: '0 1,4,9,12,15,18,21 * * *'
  workflow_dispatch:

jobs:
  update-meta-targeting:
    name: Update Meta Targeting
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        iso-code: ["AD", "AE", "AG", "AI", "AL", "AM", "AO", "AR", "AT", "AU", 
                   "AZ", "BA", "BB", "BD", "BE", "BF", "BG", "BH", "BI", "BJ", "BM", 
                   "BN", "BO", "BR", "BS", "BT", "BW", "BY", "BZ", "CA", "CD", "CF", 
                   "CG", "CH", "CI", "CL", "CM", "CO", "CR", "CV", "CY", "CZ", "DE", 
                   "DJ", "DK", "DM", "DO", "DZ", "EC", "EE", "EG", "ER", "ES", "ET", 
                   "FI", "FJ", "FK", "FM", "FR", "GA", "GB", "GD", "GE", "GG", "GH", 
                   "GI", "GM", "GN", "GQ", "GR", "GT", "GW", "GY", "HN", "HR", "HT", 
                   "HU", "ID", "IE", "IL", "IM", "IN", "IQ", "IS", "IT", "JE", "JM", 
                   "JO", "JP", "KE", "KG", "KH", "KI", "KM", "KN", "KW", "KY", "KZ", 
                   "LA", "LB", "LC", "LI", "LK", "LR", "LS", "LT", "LU", "LV", "LY", 
                   "MA", "MC", "MD", "ME", "MG", "MH", "MK", "ML", "MM", "MN", "MR", 
                   "MS", "MT", "MU", "MV", "MW", "MX", "MY", "MZ", "NA", "NE", "NG", 
                   "NI", "NL", "NO", "NP", "NR", "NZ", "OM", "PA", "PE", "PG", "PH", 
                   "PK", "PL", "PS", "PT", "PW", "PY", "QA", "RO", "RS", "RW", "SA", 
                   "SB", "SC", "SE", "SG", "SH", "SI", "SK", "SL", "SM", "SN", "SO", 
                   "SR", "SS", "ST", "SV", "SZ", "TC", "TD", "TG", "TH", "TJ", "TM", 
                   "TN", "TO", "TR", "TT", "TV", "TW", "TZ", "UA", "UG", "US", "UY", 
                   "UZ", "VC", "VE", "VG", "VI", "VN", "VU", "WF", "WS", "YE", "YT", 
                   "ZA", "ZM", "ZW", "XK", "HK", "TL", "KR"]
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GH_PAT }}      
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      TELEGRAM_BOT_ID: ${{ secrets.TELEGRAM_BOT_ID }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
    steps:
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Setup - Checkout repo
        uses: actions/checkout@v3
      - name: Setup R dependencies
        id: setup-deps
        uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: true
        with:
          cache-version: 1
          needs: |
            any::tidyverse
            any::httr
            any::remotes
            any::shiny
            any::scales
            any::treemap
            any::here
            any::jsonlite
            any::janitor
            any::quarto
            any::highcharter
            any::lubridate
            any::gt
            any::gtExtras
            any::pacman
            any::openxlsx
            any::sf
            any::xml2
            any::rvest
            any::reticulate
            any::fs
            any::countrycode
            any::progress
            any::cli
            any::digest
            any::glue
            any::vroom
            any::prettydoc
            any::DT
            any::piggyback
            any::httr2
            any::openssl
      - name: Fallback - install R dependencies
        if: steps.setup-deps.outcome != 'success'
        shell: Rscript {0}
        run: |
          packages <- c(
            "tidyverse", "httr", "remotes", "shiny", "scales", "treemap",
            "here", "jsonlite", "janitor", "quarto", "highcharter",
            "lubridate", "gt", "gtExtras", "pacman", "openxlsx", "sf",
            "xml2", "rvest", "reticulate", "fs", "countrycode", "progress",
            "cli", "digest", "glue", "vroom", "prettydoc", "DT",
            "piggyback", "httr2", "openssl"
          )
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing) > 0) {
            options(repos = c(CRAN = "https://cloud.r-project.org"))
            install.packages(missing)
          }
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing) > 0) {
            stop("Missing R packages after fallback install: ", paste(missing, collapse = ", "))
          }
      - name: "Script - Meta Run for ${{ matrix.iso-code }}"
        run: Rscript 'get_audiences.R' "30" "${{ matrix.iso-code }}"
